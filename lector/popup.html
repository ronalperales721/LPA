<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: system-ui, sans-serif;
      width: 260px;
      padding: 14px;
      margin: 0;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 14px;
    }
    select, button {
      width: 100%;
      padding: 8px;
      font-size: 14px;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    button {
      background: #0067c0;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover {
      background: #00559e;
    }
    #estado {
      font-size: 12px;
      color: #444;
      margin: 0;
    }
  </style>
</head>
<body>
  <label for="selector-voz">Voz neuronal local:</label>
  <select id="selector-voz"></select>
  <button id="probar">Probar voz</button>
  <p id="estado">Conectando con el servidor...</p>
  <script src="popup.js"></script>
</body>
</html>
